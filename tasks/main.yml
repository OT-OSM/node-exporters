---
- name: Create node_exporter group
  group:
    name: node_exporter
    state: present

- name: Create node_exporter user
  user:
    name: node_exporter
    group: node_exporter
    system: yes
    shell: /usr/sbin/nologin

- name: Download Node Exporter
  get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v1.8.1/node_exporter-1.8.1.linux-amd64.tar.gz"
    dest: "/tmp/node_exporter.tar.gz"

- name: Create extraction directory
  file:
    path: /tmp/node_exporter_extract
    state: directory

- name: Extract Node Exporter
  unarchive:
    src: "/tmp/node_exporter.tar.gz"
    dest: "/tmp/node_exporter_extract"
    remote_src: yes

- name: Move binary to /usr/local/bin
  copy:
    src: "/tmp/node_exporter_extract/node_exporter-1.8.1.linux-amd64/node_exporter"
    dest: "/usr/local/bin/node_exporter"
    mode: '0755'
    owner: root
    group: root
    remote_src: yes
  notify: Restart Node Exporter

- name: Setup Systemd Service
  template:
    src: node-exporter.service.j2
    dest: /etc/systemd/system/node-exporter.service
  notify: Restart Node Exporter

- name: Start Node Exporter
  systemd:
    name: node-exporter
    state: started
    enabled: yes
    daemon_reload: yes
